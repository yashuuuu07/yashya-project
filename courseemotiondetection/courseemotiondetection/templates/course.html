{% extends "base.html" %}

{% block title %}{{ course.title }} - EmotionTrack AI{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
    <!-- Video Player Column -->
    <div class="lg:col-span-2 space-y-8">
        <div class="aspect-video glass rounded-3xl overflow-hidden shadow-2xl relative">
            <iframe id="courseVideo" class="w-full h-full"
                src="https://www.youtube.com/embed/{{ video_id }}?enablejsapi=1" title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <div class="glass p-8 rounded-3xl">
            <h2 class="text-3xl font-bold mb-4">{{ course.title }}</h2>
            <p class="text-gray-400 leading-relaxed">{{ course.description }}</p>
        </div>
    </div>

    <!-- Side Panel: Emotion Tracking -->
    <div class="space-y-8">
        <div class="glass p-8 rounded-3xl sticky top-28">
            <h3 class="text-xl font-bold mb-6 flex items-center">
                <span class="w-3 h-3 bg-green-500 rounded-full mr-3 animate-pulse"></span>
                Emotion Tracker
            </h3>

            <div class="aspect-video bg-black/40 rounded-2xl mb-6 relative overflow-hidden border border-white/5">
                <video id="webcam" class="w-full h-full object-cover" autoplay muted playsinline></video>
                <canvas id="overlay" class="absolute inset-0 w-full h-full"></canvas>
                <div id="status"
                    class="absolute bottom-4 left-4 right-4 bg-black/60 backdrop-blur px-3 py-1 rounded-lg text-xs text-center">
                    Initializing camera...
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center p-4 bg-white/5 rounded-2xl">
                    <span class="text-gray-400 text-sm">Primary Emotion</span>
                    <span id="currentEmotion" class="font-bold text-blue-400 uppercase">--</span>
                </div>
                <div class="flex justify-between items-center p-4 bg-white/5 rounded-2xl">
                    <span class="text-gray-400 text-sm">Engagement Score</span>
                    <span id="engagementScore" class="font-bold text-purple-400">0%</span>
                </div>
            </div>

            <button id="toggleTracking"
                class="w-full mt-8 py-3 bg-white/10 hover:bg-white/20 rounded-xl font-semibold transition">
                Pause Tracking
            </button>
        </div>
    </div>
</div>

<!-- Face-API.js Bundle - Using a more stable Unpkg link -->
<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"
    onerror="document.getElementById('status').innerText = 'Failed to download AI library. Please check your internet connection.';"></script>
<script>
    const COURSE_ID = "{{ course.id }}";
    const VIDEO_ID = "{{ video_id }}";
    console.log("Course Page Loaded. Required IDs:", { COURSE_ID, VIDEO_ID });
</script>
<script src="{{ url_for('static', filename='js/emotion.js') }}"></script>
{% endblock %}
